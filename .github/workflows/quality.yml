name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -path './.git' -prune -o -type f -name '*.php' -print0)

      - name: JavaScript syntax check
        run: node --check views/js/front.js

      - name: Static module validation
        run: php tests/static_validation.php

      - name: Runtime regression smoke test
        run: php tests/runtime_smoke.php

      - name: Configuration presentation and form regression
        run: php tests/portfolio-ui.php

      - name: PrestaShop 8 translation bridge regression
        run: php tests/translation_bridge_smoke.php

      - name: Localized withdrawal status regression
        run: php tests/status_localization_smoke.php

      - name: Transactional submission pipeline regression
        run: php tests/submission_pipeline_smoke.php

      - name: Final POST lifecycle regression
        run: php tests/submission_controller_lifecycle_smoke.php

      - name: Final action lifecycle regression
        run: php tests/submission_action_lifecycle_smoke.php

      - name: In-memory submission transaction runtime
        run: php tests/submission_transaction_smoke.php

      - name: Rebuild deterministic Back Office translation catalogues
        run: |
          python3 tools/build_admin_translation_catalogs.py
          git diff --exit-code -- translations

      - name: Rebuild deterministic status translation catalogues
        run: |
          python3 tools/build_status_translation_catalogs.py
          git diff --exit-code -- translations

      - name: Translation and mail validation
        run: python3 tests/validate_catalogs.py
